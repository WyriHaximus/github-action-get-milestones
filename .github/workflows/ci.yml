name: Continuous Integration
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  get-milestones:
    name: Get Milestones (${{ matrix.runs-on }})
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-slim
          - ubuntu-latest
          - macos-latest
          - windows-latest
          - ubuntu-24.04-arm
          - ubuntu-22.04-arm
          - macos-15-intel
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Get Milestones
        id: milestones
        uses: ./
      - name: Show Milestones
        run: echo "${MILESTONES}"
        env:
          MILESTONES: ${{ steps.milestones.outputs.milestones }}
      - name: Assert Milestones Output
        uses: nick-fields/assert-action@22dd2a66ef733fe92022d3704183ac007463eecb # v3.0.0
        with:
          expected: "[{\"url\":\"https://api.github.com/repos/WyriHaximus/github-action-get-milestones/milestones/"
          actual: ${{ steps.milestones.outputs.milestones }}
          comparison: startsWith